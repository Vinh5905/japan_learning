services:
  postgres:
    image: postgres:16-alpine
    container_name: kanji-learning-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kanji
      POSTGRES_PASSWORD: kanji
      POSTGRES_DB: kanji_learning
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanji -d kanji_learning"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
